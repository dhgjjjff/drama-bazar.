<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drama Bazar - Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .premium-glass { background: rgba(18, 18, 22, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-[#040406] text-white font-sans antialiased min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-zinc-800">
            <div>
                <h1 class="text-3xl font-black italic text-green-500 tracking-tighter">DRAMA BAZAR</h1>
                <p class="text-xs text-zinc-400 font-semibold mt-1">Admin Dashboard & Content Manager</p>
            </div>
            <a href="index.html" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-bold rounded-xl border border-zinc-700 transition-all flex items-center gap-2">
                <i data-lucide="external-link" class="w-4 h-4"></i> View Main Site
            </a>
        </div>

        <!-- Add / Edit Form -->
        <div class="premium-glass rounded-3xl p-6 mb-10 border border-zinc-800 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 id="formTitle" class="text-lg font-black text-zinc-200 flex items-center gap-2 uppercase tracking-wider">
                    <i data-lucide="plus-circle" class="text-green-500 w-5 h-5"></i> Add New Content / Movie / Series
                </h2>
                <button type="button" id="cancelEditBtn" onclick="resetFormState()" class="hidden text-xs text-amber-400 hover:underline font-bold">
                    Cancel Editing
                </button>
            </div>

            <form id="contentForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="hidden" id="editDocId" value="">

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Title *</label>
                    <input type="text" id="title" required placeholder="e.g. All of Us Are Dead" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Category *</label>
                    <select id="category" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500 cursor-pointer">
                        <option value="Trending">Trending</option>
                        <option value="Korean Drama">Korean Drama</option>
                        <option value="Chinese Drama">Chinese Drama</option>
                        <option value="Anime Series">Anime Series</option>
                        <option value="Movies">Movies / Trending Movie</option>
                        <option value="Hollywood Movie">Hollywood Movie</option>
                        <option value="South Movie">South Movie</option>
                        <option value="Short Drama">Short Drama</option>
                        <option value="Unofficial Drama">Unofficial Drama</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Poster Image URL (ImgBB Direct Link) *</label>
                    <input type="url" id="img" required placeholder="https://i.ibb.co/..." class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Series ID (Group Same Drama Episodes) *</label>
                    <input type="text" id="seriesId" required placeholder="e.g. all-of-us-are-dead-s1" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Language *</label>
                    <input type="text" id="lang" value="Hindi Dubbed" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">Season</label>
                        <input type="number" id="season" value="1" min="1" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">Episode</label>
                        <input type="number" id="episode" value="1" min="1" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Description</label>
                    <textarea id="description" rows="2" placeholder="Brief summary of the drama/movie..." class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500"></textarea>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Embed Video Code / Iframe Tag *</label>
                    <textarea id="embed" required rows="3" placeholder='<iframe src="https://..." allowfullscreen></iframe>' class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:outline-none focus:border-green-500"></textarea>
                </div>

                <div class="sm:col-span-2 mt-2">
                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-black font-black py-4 rounded-xl shadow-lg shadow-green-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
                        <i data-lucide="upload-cloud" class="w-5 h-5"></i> Publish Drama / Movie
                    </button>
                </div>
            </form>
        </div>

        <!-- Live Data List -->
        <div class="premium-glass rounded-3xl p-6 border border-zinc-800 shadow-2xl">
            <h2 class="text-lg font-black text-zinc-200 mb-6 flex items-center gap-2 uppercase tracking-wider">
                <i data-lucide="database" class="text-blue-500 w-5 h-5"></i> Live Database Entries (<span id="totalCount">0</span>)
            </h2>
            <div id="contentList" class="space-y-3">
                <p class="text-zinc-500 text-xs text-center py-6">Loading entries from Firebase...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtg0Np6be7dRKtXSumGM3oNCVvLZdtY38",
            authDomain: "dramabazar-5ffca.firebaseapp.com",
            projectId: "dramabazar-5ffca",
            storageBucket: "dramabazar-5ffca.appspot.com",
            messagingSenderId: "1025286281404",
            appId: "1:1025286281404:web:755d344fe8dc62301998b9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const contentForm = document.getElementById('contentForm');
        const contentList = document.getElementById('contentList');
        const totalCount = document.getElementById('totalCount');
        let globalDocsMap = {};

        if (window.lucide) window.lucide.createIcons();

        // Save / Update Data in Firebase
        contentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const editDocId = document.getElementById('editDocId').value;

            submitBtn.disabled = true;
            submitBtn.innerText = editDocId ? "Updating..." : "Publishing...";

            const payload = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                img: document.getElementById('img').value,
                seriesId: document.getElementById('seriesId').value,
                lang: document.getElementById('lang').value,
                season: document.getElementById('season').value,
                episode: document.getElementById('episode').value,
                description: document.getElementById('description').value,
                embed: document.getElementById('embed').value,
                updatedAt: new Date().toISOString()
            };

            try {
                if (editDocId) {
                    await updateDoc(doc(db, "movies", editDocId), payload);
                    alert("✅ Success! Item updated.");
                } else {
                    payload.createdAt = new Date().toISOString();
                    await addDoc(collection(db, "movies"), payload);
                    alert("✅ Success! Item added to Drama Bazar.");
                }
                resetFormState();
            } catch (err) {
                alert("❌ Error: " + err.message);
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Load & Realtime Read Firebase Data
        onSnapshot(collection(db, "movies"), (snapshot) => {
            totalCount.innerText = snapshot.docs.length;
            globalDocsMap = {};

            if (snapshot.empty) {
                contentList.innerHTML = `<p class="text-zinc-600 text-xs text-center py-6">No entries in database yet.</p>`;
                return;
            }

            let html = '';
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                globalDocsMap[docSnap.id] = data;

                html += `
                    <div class="flex items-center justify-between p-3.5 bg-[#121215] border border-zinc-800/80 rounded-2xl">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <img src="${data.img}" class="w-12 h-12 object-cover rounded-xl bg-zinc-800 flex-shrink-0" onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=500&auto=format&fit=crop'">
                            <div class="truncate">
                                <h4 class="font-bold text-xs text-zinc-200 truncate">${data.title || 'Untitled'}</h4>
                                <p class="text-[10px] text-zinc-500 mt-0.5">${data.category} | S${data.season} E${data.episode} | ${data.lang}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0 ml-2">
                            <button onclick="editItem('${docSnap.id}')" class="px-3 py-1.5 bg-amber-500/10 text-amber-400 hover:bg-amber-500 hover:text-black rounded-xl text-xs font-bold transition-all">
                                Edit
                            </button>
                            <button onclick="deleteItem('${docSnap.id}')" class="px-3 py-1.5 bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white rounded-xl text-xs font-bold transition-all">
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            });
            contentList.innerHTML = html;
        });

        // Edit Item Populate
        window.editItem = (id) => {
            const data = globalDocsMap[id];
            if (!data) return;

            document.getElementById('editDocId').value = id;
            document.getElementById('title').value = data.title || '';
            document.getElementById('category').value = data.category || 'Trending';
            document.getElementById('img').value = data.img || '';
            document.getElementById('seriesId').value = data.seriesId || '';
            document.getElementById('lang').value = data.lang || 'Hindi Dubbed';
            document.getElementById('season').value = data.season || 1;
            document.getElementById('episode').value = data.episode || 1;
            document.getElementById('description').value = data.description || '';
            document.getElementById('embed').value = data.embed || '';

            document.getElementById('formTitle').innerHTML = `<i data-lucide="edit" class="text-amber-400 w-5 h-5"></i> Edit Content Details`;
            document.getElementById('submitBtn').innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> Update Drama / Movie`;
            document.getElementById('submitBtn').className = "w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-black font-black py-4 rounded-xl shadow-lg shadow-amber-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider";
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.lucide) window.lucide.createIcons();
        };

        // Reset Form State
        window.resetFormState = () => {
            contentForm.reset();
            document.getElementById('editDocId').value = '';
            document.getElementById('formTitle').innerHTML = `<i data-lucide="plus-circle" class="text-green-500 w-5 h-5"></i> Add New Content / Movie / Series`;
            document.getElementById('submitBtn').innerHTML = `<i data-lucide="upload-cloud" class="w-5 h-5"></i> Publish Drama / Movie`;
            document.getElementById('submitBtn').className = "w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-black font-black py-4 rounded-xl shadow-lg shadow-green-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            if (window.lucide) window.lucide.createIcons();
        };

        // Delete Function Global Expose
        window.deleteItem = async (id) => {
            if (confirm("Are you sure you want to delete this drama/episode?")) {
                try {
                    await deleteDoc(doc(db, "movies", id));
                } catch (err) {
                    alert("Delete failed: " + err.message);
                }
            }
        };
    </script>
</body>
</html>
