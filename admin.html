<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drama Bazar - Pro Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .premium-glass { background: rgba(18, 18, 22, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-[#040406] text-white font-sans antialiased min-h-screen p-4 sm:p-8">

    <div class="max-w-5xl mx-auto pb-20">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-zinc-800">
            <div>
                <h1 class="text-3xl font-black italic text-green-500 tracking-tighter">DRAMA BAZAR</h1>
                <p class="text-xs text-zinc-400 font-semibold mt-0.5">Pro CMS Dashboard & Auto-Sync Engine</p>
            </div>
            <a href="index.html" class="px-4 py-2 bg-zinc-900 hover:bg-zinc-800 text-xs font-bold rounded-xl border border-zinc-800 transition-all flex items-center gap-2">
                <i data-lucide="external-link" class="w-4 h-4"></i> View Main Site
            </a>
        </div>

        <!-- 1. Live Dashboard Stats -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">
            <div class="premium-glass p-4 rounded-2xl border border-zinc-800 text-center">
                <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Total Content</p>
                <h3 id="statTotal" class="text-2xl font-black text-white mt-1">0</h3>
            </div>
            <div class="premium-glass p-4 rounded-2xl border border-zinc-800 text-center">
                <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Korean Drama</p>
                <h3 id="statKdrama" class="text-2xl font-black text-blue-400 mt-1">0</h3>
            </div>
            <div class="premium-glass p-4 rounded-2xl border border-zinc-800 text-center">
                <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Movies</p>
                <h3 id="statMovie" class="text-2xl font-black text-cyan-400 mt-1">0</h3>
            </div>
            <div class="premium-glass p-4 rounded-2xl border border-zinc-800 text-center">
                <p class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Anime Series</p>
                <h3 id="statAnime" class="text-2xl font-black text-purple-400 mt-1">0</h3>
            </div>
        </div>

        <!-- 2. Content Form -->
        <div class="premium-glass rounded-3xl p-6 mb-10 border border-zinc-800 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 id="formTitle" class="text-lg font-black text-zinc-200 flex items-center gap-2 uppercase tracking-wider">
                    <i data-lucide="plus-circle" class="text-green-500 w-5 h-5"></i> Add New Content / Episode
                </h2>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="clearFullForm()" class="text-xs text-red-400 hover:underline font-bold flex items-center gap-1">
                        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Clear All
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="resetFormState()" class="hidden text-xs text-amber-400 hover:underline font-bold">
                        Cancel Edit
                    </button>
                </div>
            </div>

            <form id="contentForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="hidden" id="editDocId" value="">

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Title *</label>
                    <input type="text" id="title" required placeholder="e.g. True Beauty" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Category *</label>
                    <select id="category" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500 cursor-pointer">
                        <option value="Trending">Trending</option>
                        <option value="Korean Drama">Korean Drama</option>
                        <option value="Chinese Drama">Chinese Drama</option>
                        <option value="Anime Series">Anime Series</option>
                        <option value="Movies">Movies / Trending Movie</option>
                        <option value="Hollywood Movie">Hollywood Movie</option>
                        <option value="South Movie">South Movie</option>
                        <option value="Short Drama">Short Drama</option>
                        <option value="Unofficial Drama">Unofficial Drama</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">
                        Poster Image URL (Auto-Syncs Series) *
                        <span class="text-[10px] text-green-400 font-normal ml-1">⚡ Auto-Sync Active</span>
                    </label>
                    <input type="url" id="img" required placeholder="https://i.ibb.co/..." class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Series ID *</label>
                    <input type="text" id="seriesId" required placeholder="e.g. true-beauty-s1" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Language *</label>
                    <input type="text" id="lang" value="Hindi Dubbed" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">Season</label>
                        <input type="number" id="season" value="1" min="1" class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-green-400 mb-1">Episode (Auto +1) ⚡</label>
                        <input type="number" id="episode" value="1" min="1" class="w-full bg-[#121215] border border-green-500/60 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500 font-bold">
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-zinc-400 mb-1">Description</label>
                    <textarea id="description" rows="2" placeholder="Brief summary of the drama/movie..." class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-green-500"></textarea>
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-green-400 mb-1">Embed Video Code / Iframe Tag *</label>
                    <textarea id="embed" required rows="3" placeholder='<iframe src="https://..." allowfullscreen></iframe>' class="w-full bg-[#121215] border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:outline-none focus:border-green-500"></textarea>
                </div>

                <div class="sm:col-span-2 flex flex-col sm:flex-row items-center gap-4 mt-2">
                    <label class="flex items-center gap-2.5 text-xs font-bold text-zinc-300 cursor-pointer select-none bg-[#121215] px-4 py-3 rounded-xl border border-zinc-800 w-full sm:w-auto">
                        <input type="checkbox" id="isActive" checked class="w-4 h-4 rounded border-zinc-700 bg-zinc-900 accent-green-500 cursor-pointer">
                        <span>Show on Main Site (Active)</span>
                    </label>

                    <button type="submit" id="submitBtn" class="flex-1 w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-black font-black py-3.5 rounded-xl shadow-lg shadow-green-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-wider">
                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> Publish Content
                    </button>
                </div>
            </form>
        </div>

        <!-- 3. Filter & Realtime Database List -->
        <div class="premium-glass rounded-3xl p-6 border border-zinc-800 shadow-2xl">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                <h2 class="text-base font-black text-zinc-200 flex items-center gap-2 uppercase tracking-wider">
                    <i data-lucide="database" class="text-blue-500 w-4 h-4"></i> Live Database Entries (<span id="totalCount">0</span>)
                </h2>
                
                <!-- Search & Category Filters -->
                <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                    <div class="relative">
                        <input type="text" id="searchBar" placeholder="Search title or ID..." class="w-full sm:w-48 bg-[#121215] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 pl-8">
                        <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-500 absolute left-2.5 top-2.5"></i>
                    </div>
                    <select id="filterCat" class="bg-[#121215] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 cursor-pointer">
                        <option value="All">All Categories</option>
                        <option value="Trending">Trending</option>
                        <option value="Korean Drama">Korean Drama</option>
                        <option value="Chinese Drama">Chinese Drama</option>
                        <option value="Anime Series">Anime Series</option>
                        <option value="Movies">Movies</option>
                        <option value="Hollywood Movie">Hollywood Movie</option>
                        <option value="South Movie">South Movie</option>
                        <option value="Short Drama">Short Drama</option>
                        <option value="Unofficial Drama">Unofficial Drama</option>
                    </select>
                </div>
            </div>

            <div id="contentList" class="space-y-3">
                <p class="text-zinc-500 text-xs text-center py-6">Loading entries from Firebase...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtg0Np6be7dRKtXSumGM3oNCVvLZdtY38",
            authDomain: "dramabazar-5ffca.firebaseapp.com",
            projectId: "dramabazar-5ffca",
            storageBucket: "dramabazar-5ffca.appspot.com",
            messagingSenderId: "1025286281404",
            appId: "1:1025286281404:web:755d344fe8dc62301998b9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const contentForm = document.getElementById('contentForm');
        const contentList = document.getElementById('contentList');
        const totalCount = document.getElementById('totalCount');
        let allData = [];

        if (window.lucide) window.lucide.createIcons();

        // 1. Submit / Update & Smart Sync
        contentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const editDocId = document.getElementById('editDocId').value;
            const currentEp = parseInt(document.getElementById('episode').value || "1");

            submitBtn.disabled = true;
            submitBtn.innerText = editDocId ? "Updating & Syncing..." : "Publishing...";

            const payload = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                img: document.getElementById('img').value,
                seriesId: document.getElementById('seriesId').value,
                lang: document.getElementById('lang').value,
                season: document.getElementById('season').value,
                episode: String(currentEp),
                description: document.getElementById('description').value,
                embed: document.getElementById('embed').value,
                isActive: document.getElementById('isActive').checked,
                updatedAt: new Date().toISOString()
            };

            try {
                if (editDocId) {
                    // SMART SYNC: Sync new poster URL across all episodes of the same seriesId
                    const q = query(collection(db, "movies"), where("seriesId", "==", payload.seriesId));
                    const snap = await getDocs(q);
                    const updatePromises = [];
                    snap.forEach((d) => {
                        updatePromises.push(updateDoc(d.ref, { 
                            img: payload.img,
                            title: payload.title,
                            category: payload.category,
                            lang: payload.lang
                        }));
                    });
                    await Promise.all(updatePromises);
                    await updateDoc(doc(db, "movies", editDocId), payload);
                    alert(`✅ Updated! Poster URL auto-synced across ${snap.docs.length} episode(s).`);
                    resetFormState();
                } else {
                    payload.createdAt = new Date().toISOString();
                    await addDoc(collection(db, "movies"), payload);
                    alert(`✅ Success! Episode ${currentEp} Published.`);
                    
                    // Smart retain fields for rapid next episode upload
                    document.getElementById('embed').value = '';
                    document.getElementById('episode').value = currentEp + 1;
                }
            } catch (err) {
                alert("❌ Error: " + err.message);
            } finally {
                submitBtn.disabled = false;
                if (!editDocId) {
                    submitBtn.innerHTML = `<i data-lucide="upload-cloud" class="w-4 h-4"></i> Publish Episode ${parseInt(document.getElementById('episode').value)}`;
                }
                if (window.lucide) window.lucide.createIcons();
            }
        });

        // 2. Realtime Listener
        onSnapshot(collection(db, "movies"), (snapshot) => {
            allData = snapshot.docs.map(docSnap => ({
                id: docSnap.id,
                ...docSnap.data()
            }));
            updateStats(allData);
            renderList(allData);
        });

        // 3. Update Dashboard Stats
        function updateStats(data) {
            totalCount.innerText = data.length;
            document.getElementById('statTotal').innerText = data.length;
            document.getElementById('statKdrama').innerText = data.filter(d => d.category === 'Korean Drama').length;
            document.getElementById('statMovie').innerText = data.filter(d => d.category && d.category.includes('Movie')).length;
            document.getElementById('statAnime').innerText = data.filter(d => d.category === 'Anime Series').length;
        }

        // 4. Render Database Entries with Filter & Search
        function renderList(data) {
            const search = document.getElementById('searchBar').value.toLowerCase().trim();
            const filter = document.getElementById('filterCat').value;

            const filtered = data.filter(d => {
                const matchCat = (filter === 'All') || (d.category === filter);
                const matchSearch = (!search) || 
                    (d.title && d.title.toLowerCase().includes(search)) || 
                    (d.seriesId && d.seriesId.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                contentList.innerHTML = `<p class="text-zinc-600 text-xs text-center py-6">No matching entries found.</p>`;
                return;
            }

            contentList.innerHTML = filtered.map(d => `
                <div class="flex items-center justify-between p-3.5 bg-[#121215] border border-zinc-800/80 rounded-2xl hover:border-zinc-700 transition-all">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <img src="${d.img}" class="w-12 h-12 object-cover rounded-xl bg-zinc-800 flex-shrink-0" onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=500&auto=format&fit=crop'">
                        <div class="truncate">
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-xs text-zinc-200 truncate">${d.title || 'Untitled'}</h4>
                                <span class="text-[9px] font-black px-1.5 py-0.2 rounded ${d.isActive !== false ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}">
                                    ${d.isActive !== false ? 'ACTIVE' : 'HIDDEN'}
                                </span>
                            </div>
                            <p class="text-[10px] text-zinc-500 mt-0.5">${d.category} | S${d.season || 1} E${d.episode || 1} | ID: ${d.seriesId}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0 ml-2">
                        <button onclick="editItem('${d.id}')" class="px-3 py-1.5 bg-amber-500/10 text-amber-400 hover:bg-amber-500 hover:text-black rounded-xl text-xs font-bold transition-all">
                            Edit
                        </button>
                        <button onclick="deleteItem('${d.id}')" class="px-3 py-1.5 bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white rounded-xl text-xs font-bold transition-all">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');

            if (window.lucide) window.lucide.createIcons();
        }

        // 5. Edit Populate
        window.editItem = (id) => {
            const d = allData.find(x => x.id === id);
            if (!d) return;

            document.getElementById('editDocId').value = id;
            document.getElementById('title').value = d.title || '';
            document.getElementById('category').value = d.category || 'Trending';
            document.getElementById('img').value = d.img || '';
            document.getElementById('seriesId').value = d.seriesId || '';
            document.getElementById('lang').value = d.lang || 'Hindi Dubbed';
            document.getElementById('season').value = d.season || 1;
            document.getElementById('episode').value = d.episode || 1;
            document.getElementById('description').value = d.description || '';
            document.getElementById('embed').value = d.embed || '';
            document.getElementById('isActive').checked = d.isActive !== false;

            document.getElementById('formTitle').innerHTML = `<i data-lucide="edit" class="text-amber-400 w-5 h-5"></i> Edit Content & Sync Poster`;
            document.getElementById('submitBtn').innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> Update & Auto-Sync`;
            document.getElementById('submitBtn').className = "flex-1 w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-black font-black py-3.5 rounded-xl shadow-lg shadow-amber-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-wider";
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (window.lucide) window.lucide.createIcons();
        };

        // 6. Reset Functions
        window.clearFullForm = () => {
            contentForm.reset();
            document.getElementById('editDocId').value = '';
            document.getElementById('season').value = 1;
            document.getElementById('episode').value = 1;
            document.getElementById('lang').value = 'Hindi Dubbed';
            document.getElementById('isActive').checked = true;
            resetFormState();
        };

        window.resetFormState = () => {
            document.getElementById('editDocId').value = '';
            document.getElementById('formTitle').innerHTML = `<i data-lucide="plus-circle" class="text-green-500 w-5 h-5"></i> Add New Content / Episode`;
            document.getElementById('submitBtn').innerHTML = `<i data-lucide="upload-cloud" class="w-4 h-4"></i> Publish Content`;
            document.getElementById('submitBtn').className = "flex-1 w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-black font-black py-3.5 rounded-xl shadow-lg shadow-green-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-wider";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            if (window.lucide) window.lucide.createIcons();
        };

        // 7. Delete Item
        window.deleteItem = async (id) => {
            if (confirm("Are you sure you want to delete this drama/episode?")) {
                try {
                    await deleteDoc(doc(db, "movies", id));
                } catch (err) {
                    alert("Delete failed: " + err.message);
                }
            }
        };

        // 8. Event Listeners for Filters
        document.getElementById('searchBar').addEventListener('input', () => renderList(allData));
        document.getElementById('filterCat').addEventListener('change', () => renderList(allData));
    </script>
</body>
</html>
