            navigator.serviceWorker.register('/sw.js')

                .catch(err => console.log('Monetag SW failed:', err));

        const firebaseConfig = {
            apiKey: "AIzaSyBtg0Np6be7dRKtXSumGM3oNCVvLZdtY38",
            authDomain: "dramabazar-5ffca.firebaseapp.com",
            projectId: "dramabazar-5ffca",
            storageBucket: "dramabazar-5ffca.appspot.com",
            messagingSenderId: "1025286281404",

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const { useState, useEffect } = React;

        const DEFAULT_POSTER = "https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=500&auto=format&fit=crop";

        const GLOW_CLASSES = ['glow-cyan', 'glow-pink', 'glow-green', 'glow-yellow', 'glow-purple', 'glow-orange'];

        const getGlowClass = (index) => GLOW_CLASSES[index % GLOW_CLASSES.length];

        function UserApp() {
            const [showSplash, setShowSplash] = useState(true);
            const [isFading, setIsFading] = useState(false);

            const [currentNav, setCurrentNav] = useState('home'); 
            const [currentPage, setCurrentPage] = useState('main'); 
            const [allContent, setAllContent] = useState([]);
            const [selectedContent, setSelectedContent] = useState(null);
            const [showProfileMenu, setShowProfileMenu] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedSeason, setSelectedSeason] = useState('1'); 
            const [sliderIndex, setSliderIndex] = useState(0);

            useEffect(() => {
                const fadeTimer = setTimeout(() => setIsFading(true), 2000); 
                const hideTimer = setTimeout(() => setShowSplash(false), 2500); 
                return () => { clearTimeout(fadeTimer); clearTimeout(hideTimer); };
            }, []);

            useEffect(() => {
                const unsubscribe = onSnapshot(collection(db, "movies"), (querySnapshot) => {
                    const items = [];
                    querySnapshot.forEach((doc) => { 
                        const data = doc.data();
                        items.push({ 
                            id: doc.id, 
                            title: data.title || "Untitled Drama",
                            img: (data.img && data.img.trim() !== "") ? data.img : DEFAULT_POSTER,
                            category: data.category || "Trending",
                            seriesId: data.seriesId || doc.id,
                            lang: data.lang || "Hindi",
                            episode: data.episode || "1",
                            season: data.season || "1",
                            embed: data.embed || "",
                            description: data.description || "Coming soon on Drama Bazar"
                        }); 
                    });
                    setAllContent(items);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (selectedContent) {
                    setSelectedSeason(String(selectedContent.season || '1'));
                }
            }, [selectedContent]);

            const getUniqueSeries = (data) => {
                const seen = new Set();
                return data.filter(item => {
                    if(!item.seriesId) return true;
                    const duplicate = seen.has(item.seriesId);
                    seen.add(item.seriesId);
                    return !duplicate;
                });
            };

            const filteredData = allContent.filter(item => 
                item.title && item.title.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const koreanDramas = getUniqueSeries(filteredData.filter(item => 
                item.category === 'Korean Drama' || 
                (item.title && item.title.toLowerCase().includes('korean')) ||
                (item.description && item.description.toLowerCase().includes('kdrama'))
            ));

            const chineseDramas = getUniqueSeries(filteredData.filter(item => 
                item.category === 'Chinese Drama' || 
                (item.title && item.title.toLowerCase().includes('chinese')) ||
                (item.description && item.description.toLowerCase().includes('cdrama'))
            ));

            const trendingNow = getUniqueSeries(filteredData.filter(item => item.category === 'Trending'));
            const animeSeriesAll = getUniqueSeries(filteredData.filter(item => item.category === 'Anime Series'));
            const moviesList = getUniqueSeries(filteredData.filter(item => item.category === 'Movies'));
            const unofficialDramas = getUniqueSeries(filteredData.filter(item => item.category === 'Unofficial Drama'));

            const animeForYou = animeSeriesAll.slice(0, 4); 
            const animeNew = animeSeriesAll.filter(item => item.lang && item.lang.toLowerCase().includes('hindi')); 
            const animeMovies = getUniqueSeries(filteredData.filter(item => item.category === 'Anime Series' && item.title.toLowerCase().includes('movie'))); 

            const trendingMovies = getUniqueSeries(filteredData.filter(item => 
                (item.category === 'Movies' || item.category === 'Trending Movie') && 
                !item.title.toLowerCase().includes('hollywood') && 
                !item.title.toLowerCase().includes('south')
            ));

            const hollywoodMovies = getUniqueSeries(filteredData.filter(item => 
                item.category === 'Hollywood Movie' || 
                (item.title && item.title.toLowerCase().includes('hollywood')) ||
                (item.description && item.description.toLowerCase().includes('hollywood'))
            ));

            const southMovies = getUniqueSeries(filteredData.filter(item => 
                item.category === 'South Movie' || 
                (item.title && item.title.toLowerCase().includes('south')) ||
                (item.description && item.description.toLowerCase().includes('south'))
            ));

            const shortDramas = getUniqueSeries(filteredData.filter(item => 
                item.category === 'Short Drama' || 
                (item.title && item.title.toLowerCase().includes('short')) || 
                (item.category && item.category.toLowerCase().includes('short'))
            ));

            const bannerItems = trendingNow.length > 0 ? trendingNow : getUniqueSeries(filteredData).slice(0, 5);

            useEffect(() => {
                if (showSplash || currentNav !== 'home' || currentPage !== 'main' || bannerItems.length <= 1) return;
                
                const interval = setInterval(() => {
                    setSliderIndex((prevIndex) => (prevIndex + 1) % bannerItems.length);
                }, 4000);
                
                return () => clearInterval(interval);

                if (window.lucide) { 
                    window.lucide.createIcons();

                if (!selectedContent) return [];
                const seasons = allContent
                    .filter(item => item.seriesId === selectedContent.seriesId)
                    .map(item => String(item.season || '1'));
                return [...new Set(seasons)].sort((a, b) => Number(a) - Number(b));

                selectedContent.category === 'Movies' || 
                selectedContent.category === 'Trending Movie' ||

                );

                        h('div', null,

                            h('p', { className: 'text-[10px] text-green-400 font-semibold' }, isMovieMode ? 'Full Movie Mode' : 'Season ' + selectedContent.season + ' | Episode ' + selectedContent.episode)

                                h('div', { className: 'flex items-center gap-2 text-xs font-black tracking-widest text-zinc-400 uppercase' },

                                        getAvailableSeasons().map(season => 
                                            h('option', { key: season, value: season }, 'Season ' + season)

                                    ),
                                    h('div', { className: 'absolute inset-y-0 right-3 flex items-center pointer-events-none text-zinc-500' },
                                        h('i', { 'data-lucide': 'chevron-down', className: 'w-3 h-3' })
                                    )
                                )
                            ),

                            h('h3', { className: 'text-xs font-black tracking-widest text-zinc-500 uppercase mb-4 flex items-center gap-2' }, h('i', { 'data-lucide': 'layers', className: 'w-4 h-4 text-green-500' }), 'Select Episode'),
                            h('div', { className: 'grid grid-cols-4 sm:grid-cols-6 gap-3' },

                                .map(ep => h('button', { 
                                    key: ep.id,
                                    onClick: () => setSelectedContent(ep),
                                    className: 'py-3.5 rounded-xl font-bold text-xs transition-all ' + (ep.id === selectedContent.id ? 'bg-gradient-to-r from-green-500 to-emerald-600 text-black shadow-lg shadow-green-500/30 scale-[1.02]' : 'bg-[#121215] text-zinc-400 border border-zinc-800/80 hover:bg-zinc-800/40')
                                }, 'Ep ' + ep.episode))
                            )
                        )
                    )
                ) : null,

                // MAIN LAYOUT
                currentPage === 'main' ? h('div', null,
                    h('header', { className: 'p-5 flex justify-between items-center sticky top-0 backdrop-blur-md bg-[#040406]/70 z-40' },
                        h('h1', { 
                            className: 'text-2xl font-black italic text-green-500 tracking-tighter drop-shadow-[0_0_15px_rgba(34,197,94,0.7)] cursor-pointer',
                            onClick: () => { setCurrentNav('home'); setSearchQuery(''); }
                        }, 'DRAMA BAZAR'),
                        h('div', { className: 'relative' },
                            h('div', { 
                                onClick: (e) => { e.stopPropagation(); setShowProfileMenu(!showProfileMenu); },
                                className: 'w-9 h-9 rounded-full bg-zinc-800 overflow-hidden border border-zinc-700 cursor-pointer shadow-lg active:scale-95 transition-all flex items-center justify-center' 
                            }, 
                                h('img', { src: 'https://api.dicebear.com/7.x/avataaars/svg?seed=Felix' })
                            ),
                            showProfileMenu ? h('div', { className: 'absolute right-0 mt-3 w-56 premium-glass rounded-2xl p-2 shadow-2xl border border-zinc-800/50 z-50 animate-in fade-in zoom-in-95 duration-150' },

                                h('a', { href: '#', className: 'flex items-center gap-3 p-3 text-xs font-semibold text-zinc-300 hover:bg-zinc-800/50 rounded-xl transition-all' }, h('i', { 'data-lucide': 'history', className: 'w-4 h-4 text-blue-400' }), 'History'),
                                h('a', { href: 'mailto:support@dramabazar.com', className: 'flex items-center gap-3 p-3 text-xs font-semibold text-zinc-300 hover:bg-zinc-800/50 rounded-xl transition-all' }, h('i', { 'data-lucide': 'mail', className: 'w-4 h-4 text-yellow-500' }), 'Feedback Email'),
                                h('div', { className: 'h-[1px] bg-zinc-800/60 my-1' }),
                                h('a', { href: 'https://wa.me/918770654579', target: '_blank', className: 'flex items-center gap-3 p-3 text-xs font-bold text-green-400 hover:bg-green-500/10 rounded-xl transition-all' }, h('i', { 'data-lucide': 'message-circle', className: 'w-4 h-4 text-green-400' }), 'Talk to me with WhatsApp')
                            ) : null
                        )
                    ),
                    
                    h('div', { className: 'px-5 py-2' },
                        h('div', { className: 'relative premium-glass rounded-2xl flex items-center px-4 py-3.5 border border-zinc-800/60 shadow-inner' },
                            h('i', { 'data-lucide': 'search', className: 'text-zinc-500 mr-3 w-4 h-4' }),
                            h('input', { 
                                type: 'text', 
                                placeholder: 'Search drama, anime, movies...', 
                                value: searchQuery,
                                onChange: (e) => setSearchQuery(e.target.value), 
                                className: 'bg-transparent border-none outline-none w-full text-sm text-white placeholder-zinc-600' 
                            }),
                            searchQuery ? h('button', { onClick: () => setSearchQuery(''), className: 'text-zinc-500 hover:text-white ml-2 transition-colors' }, h('i', { 'data-lucide': 'x', className: 'w-4 h-4' })) : null
                        )
                    ),

                    currentNav === 'home' ? h('div', null,
                        currentSliderItem && !searchQuery && h('div', { className: 'px-5 py-3' },
                            h('div', { 
                                onClick: () => { setSelectedContent(currentSliderItem); setCurrentPage('player'); },
                                className: `w-full h-48 relative rounded-3xl overflow-hidden cursor-pointer card-shadow group transition-all ${getGlowClass(0)}`
                            },
                                h('img', { 
                                    src: currentSliderItem.img, 
                                    onError: (e) => { e.target.src = DEFAULT_POSTER; },
                                    className: 'w-full h-full object-cover group-hover:scale-105 transition-transform duration-700' 
                                }),
                                h('div', { className: 'absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent' }),
                                h('div', { className: 'absolute bottom-4 left-5 right-5' },
                                    h('span', { className: 'bg-green-500 text-black font-black text-[9px] uppercase px-2 py-0.5 rounded-md tracking-wider shadow-lg shadow-green-500/20' }, 'Trending Spot'),
                                    h('h3', { className: 'text-base font-black text-white mt-1.5 truncate drop-shadow-md' }, currentSliderItem.title),
                                    h('p', { className: 'text-[10px] text-zinc-400 font-medium line-clamp-1' }, currentSliderItem.description)
                                ),
                                h('div', { className: 'absolute top-4 right-5 flex gap-1.5 bg-black/40 backdrop-blur-md px-2 py-1 rounded-full border border-zinc-800' },
                                    bannerItems.map((_, idx) => h('div', { 
                                        key: idx, 
                                        className: `h-1 rounded-full transition-all duration-300 ${idx === sliderIndex ? 'w-4 bg-green-500' : 'w-1 bg-white/40'}` 
                                    }))
                                )
                            )
                        ),

                        trendingNow.length > 0 && h('div', { className: 'mt-6 px-5' },
                            h('div', { className: 'flex justify-between items-center mb-4' },
                                h('h2', { className: 'text-xs font-black uppercase tracking-widest text-zinc-400 flex items-center gap-2' }, h('i', { 'data-lucide': 'flame', className: 'text-orange-500 w-3.5 h-3.5' }), 'Trending Now'),
                                h('button', { onClick: () => setCurrentNav('movies'), className: 'text-[11px] font-bold text-green-500 hover:text-green-400 flex items-center gap-0.5 transition-colors' }, 'More', h('i', { 'data-lucide': 'chevron-right', className: 'w-3 h-3' }))
                            ),
                            h('div', { className: 'flex gap-4 overflow-x-auto no-scrollbar py-2 px-1' },
                                trendingNow.map((item, idx) => h('div', { key: item.id, onClick: () => { setSelectedContent(item); setCurrentPage('player'); }, class: 'min-w-[170px] max-w-[170px] cursor-pointer group' },
                                    h('div', { className: `relative rounded-2xl overflow-hidden transition-all card-shadow bg-zinc-900 aspect-video ${getGlowClass(idx)}` },
                                        h('img', { src: item.img, onError: (e) => { e.target.src = DEFAULT_POSTER; }, className: 'w-full h-full object-cover group-hover:scale-105 transition-transform duration-300' }),
                                        h('div', { className: 'absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent' }),
                                        h('div', { className: 'absolute top-2 left-2 bg-black/80 backdrop-blur-md text-[9px] px-2 py-0.5 rounded-lg border border-zinc-800 text-zinc-200 font-bold tracking-wide' }, item.lang)
                                    ),
                                    h('p', { className: 'mt-2.5 text-xs font-bold truncate text-zinc-300 group-hover:text-white transition-colors' }, item.title)
                                ))
                            )
                        ),

                        koreanDramas.length > 0 && h('div', { className: 'mt-8 px-5' },
                            h('div', { className: 'flex justify-between items-center mb-4' },
                                h('h2', { className: 'text-xs font-black uppercase tracking-widest text-zinc-400 flex items-center gap-2' }, h('i', { 'data-lucide': 'tv', className: 'text-blue-500 w-3.5 h-3.5' }), 'Korean Drama'),
                                h('button', { onClick: () => setCurrentNav('kdrama'), className: 'text-[11px] font-bold text-green-500 hover:text-green-400 flex items-center gap-0.5 transition-colors' }, 'More', h('i', { 'data-lucide': 'chevron-right', className: 'w-3 h-3' }))
                            ),
                            h('div', { className: 'flex gap-4 overflow-x-auto no-scrollbar py-2 px-1' },
                                koreanDramas.map((item, idx) => h('div', { key: item.id, onClick: () => { setSelectedContent(item); setCurrentPage('player'); }, class: 'min-w-[170px] max-w-[170px] cursor-pointer group' },
                                    h('div', { className: `relative rounded-2xl overflow-hidden transition-all card-shadow bg-zinc-900 aspect-video ${getGlowClass(idx + 1)}` },
                                        h('img', { src: item.img, onError: (e) => { e.target.src = DEFAULT_POSTER; }, className: 'w-full h-full object-cover group-hover:scale-105 transition-transform duration-300' }),
                                        h('div', { className: 'absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent' })
